<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220">
  <!-- diary card background -->
  <rect x="2" y="2" width="396" height="216" rx="18" fill="#FDF6E3" stroke="#A8D5BA" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- washi tape corner accents -->
  <rect x="18" y="-6" width="46" height="20" rx="3" fill="#C8E6C9" opacity="0.85" transform="rotate(-8 18 -6)"/>
  <rect x="336" y="206" width="46" height="20" rx="3" fill="#F7D9A0" opacity="0.8" transform="rotate(-8 336 206)"/>
  <!-- little sticker -->
  <text x="22" y="30" font-size="18">🐌</text>
  <!-- the real stats card, scaled to fit inside the frame -->
  <image href="https://raw.githubusercontent.com/sakii-ito/sakii-ito/output/stats.svg" x="14" y="14" width="372" height="192" preserveAspectRatio="xMidYMid meet"/>
</svg>
