name: generate profile widgets

on:
    schedule: # Run automatically every 24 hours
        - cron: '0 0 * * *'
    workflow_dispatch: # Allows manual triggering
    push: # Runs on every push to the main branch
        branches:
            - main

jobs:
    generate:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: generate pac-man contribution graph
              uses: abozanona/pacman-contribution-graph@main
              with:
                  github_user_name: ${{ github.repository_owner }}
                  games: 'pacman'

            - name: generate stats card
              uses: stats-organization/github-readme-stats-action@main
              with:
                  card: stats
                  options: 'username=${{ github.repository_owner }}&show_icons=true&hide_title=true&title_color=88B888&text_color=6b6b6b&icon_color=88B888&bg_color=FDF6E3&border_color=A8D5BA&border_radius=12'
                  path: dist/stats.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: generate streak stats card
              uses: DenverCoder1/github-readme-streak-stats@main
              with:
                  options: 'user=${{ github.repository_owner }}&background=FDF6E3&ring=88B888&fire=88B888&currStreakLabel=6b6b6b&sideLabels=6b6b6b&currStreakNum=6b6b6b&sideNums=6b6b6b&dates=6b6b6b&border=A8D5BA&hide_border=false'
                  path: dist/streak.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: push generated files to the output branch
              uses: crazy-max/ghaction-github-pages@v3.1.0
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
